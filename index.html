<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi</title>
    <style>
        body {
            background-color: #0c0c0c;
            color: #00ff66;
            font-family: monospace;
            margin: 0;
            padding: 20px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        h1 {
            color: #00ffaa;
        }
    </style>
</head>
<body>
    <div id="pi-content">Loading...</div>

    <script>
        fetch('Pi.txt')
            .then(response => {
                if (!response.ok) throw new Error("Network response was not ok");
                return response.text();
            })
            .then(data => {
                document.getElementById('pi-content').textContent = '3.' + data;
            })
            .catch(error => {
                document.getElementById('pi-content').textContent = "Could not load Pi digits.";
                console.error(error);
            });
    </script>
</body>
</html>
